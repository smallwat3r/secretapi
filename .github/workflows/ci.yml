name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: web/package-lock.json
    - name: Frontend install
      run: npm ci
      working-directory: web
    - name: Frontend typecheck, lint and format check
      run: npm run typecheck && npm run lint && npm run fmt:check
      working-directory: web
    - name: Frontend build
      run: npm run build
      working-directory: web

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
    - name: Build
      run: go build -v ./...
    - name: Test
      run: go test -v ./...
    - name: Lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: latest
    - name: Vulnerability scan
      run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...

    - name: Docker build
      run: docker build .
